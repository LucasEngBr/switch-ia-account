<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowX" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10a37f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="110" r="190" fill="url(#glowC)"/>
  <circle cx="1080" cy="270" r="170" fill="url(#glowX)"/>

  <!-- person icon -->
  <g transform="translate(80 92)">
    <rect width="176" height="176" rx="40" fill="#262626" stroke="#333" stroke-width="2"/>
    <circle cx="88" cy="66" r="30" fill="#fff"/>
    <path d="M30 146 a58 58 0 0 1 116 0 z" fill="#fff"/>
  </g>

  <text x="296" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#ececec">Switch IA Account</text>
  <text x="298" y="210" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#9a9a9a">Troque de conta no Claude Desktop e no Codex com um clique.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="298" y="240" width="118" height="38" rx="19" fill="#d97757" fill-opacity="0.18" stroke="#d97757"/>
    <text x="357" y="265" text-anchor="middle" fill="#f0a487">Claude</text>
    <rect x="428" y="240" width="112" height="38" rx="19" fill="#10a37f" fill-opacity="0.18" stroke="#10a37f"/>
    <text x="484" y="265" text-anchor="middle" fill="#5fd3b1">Codex</text>
    <rect x="552" y="240" width="206" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#444"/>
    <text x="655" y="265" text-anchor="middle" fill="#cfcfcf">limites 5h · semanal</text>
  </g>

  <!-- usage rings -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <circle cx="930" cy="180" r="54" stroke="#3a3a3a"/>
    <path d="M930 126 A54 54 0 1 1 879 197" stroke="#4caf50"/>
    <circle cx="1070" cy="180" r="38" stroke="#3a3a3a"/>
    <path d="M1070 142 A38 38 0 0 1 1100 203" stroke="#e0a020"/>
  </g>
</svg>
